parameters:
- name: runtimeFeed
  displayName: Feed for runtime installation
  type: string
  default: default
  values:
  - default
  - custom
  - dotnetclimsrc-feed
- name: runtimeFeedToken
  displayName: Base 64 SAS Token for runtime installation
  type: string
  default: default
  values:
  - default
  - custom
  - dotnetclimsrc-sas-token-base64
- name: configuration
  displayName: Build configuration
  type: string
  default: Release
  values:
  - Debug
  - Release
- name: buildOnly
  displayName: Build only (skip tests)
  type: boolean
  default: false
trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - '*'
  paths:
    exclude:
    - documentation/*
    - THIRD-PARTY-NOTICES.TXT
    - LICENSE.TXT

variables:
- ${{ if and(notin(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.DefinitionName'], 'dotnet-diagnostics')) }}:
  - name: isOfficialBuild
    value: true
- ${{ else }}:
  - name: isOfficialBuild
    value: false
- name: buildConfiguration
  ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
    value: Debug
  ${{ elseif eq(variables.isOfficialBuild, true) }}:
    value: Release
  ${{ else }}:
    value: ${{ parameters.configuration }}
- template : /eng/pipelines/global-variables.yml
  parameters:
    runtimeFeed: ${{ parameters.runtimeFeed }}
    runtimeFeedToken: ${{ parameters.runtimeFeedToken }}
- template: /eng/pipelines/helix-platforms.yml

extends:
  template: /eng/pipelines/pipeline-resources.yml
  parameters:
    stages:
    ########################
    # Build stage
    ########################

    - stage: build
      jobs:

      # Source-build validation
      - template: ${{ variables.sourceBuildTemplate }}
        parameters:
          enableInternalSources: true
          platform:
            name: Complete
            buildScript: ./eng/common/build.sh

      # Cross-platform product builds
      - template: /eng/pipelines/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/build.yml
          isOfficialBuild: ${{ variables.isOfficialBuild }}
          configurations:
          - ${{ variables.buildConfiguration }}
          platforms:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-musl-x64
          - linux-arm
          - linux-musl-arm
          - linux-musl-arm64
          - osx-x64
          - osx-arm64
          jobParameters:
            pipelineJobTemplate: ${{ variables.jobTemplate }}

      # PR test legs
      - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
        - ${{ if ne(parameters.buildOnly, true) }}:
          - template: /eng/pipelines/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/build.yml
              isOfficialBuild: ${{ variables.isOfficialBuild }}
              configurations:
              - ${{ variables.buildConfiguration }}
              platforms:
              - win-x64
              - osx-x64
              - linux-x64
              - linux-musl-x64
              jobParameters:
                pipelineJobTemplate: ${{ variables.jobTemplate }}
                testOnly: true

          - template: /eng/pipelines/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/tests-helix.yml
              isOfficialBuild: ${{ variables.isOfficialBuild }}
              configurations:
              - ${{ variables.buildConfiguration }}
              platforms:
              - win-x64
              - win-x86
              - win-arm64
              - linux-x64
              - linux-arm64
              - linux-musl-x64
              - osx-arm64
              jobParameters:
                pipelineJobTemplate: ${{ variables.jobTemplate }}

        # PR packaging
        - template: /eng/pipelines/package-sign-publish.yml
          parameters:
            configuration: ${{ variables.buildConfiguration }}
            pipelineJobTemplate: ${{ variables.jobTemplate }}
            isOfficialBuild: ${{ variables.isOfficialBuild }}
            dependsOn:
            - Windows_x64_${{ variables.buildConfiguration }}
            - Windows_x86_${{ variables.buildConfiguration }}
            - Windows_arm64_${{ variables.buildConfiguration }}
            - Linux_x64_${{ variables.buildConfiguration }}
            - Linux_arm64_${{ variables.buildConfiguration }}
            - Linux_musl_x64_${{ variables.buildConfiguration }}
            - MacOS_x64_${{ variables.buildConfiguration }}
            - MacOS_arm64_${{ variables.buildConfiguration }}
            - Linux_arm_${{ variables.buildConfiguration }}
            - Linux_musl_arm_${{ variables.buildConfiguration }}
            - Linux_musl_arm64_${{ variables.buildConfiguration }}

    ########################
    # Non-PR Tests stage
    ########################

    - ${{ if and(notin(variables['Build.Reason'], 'PullRequest'), ne(parameters.buildOnly, true)) }}:
      - stage: test
        displayName: Tests
        dependsOn: build
        jobs:
        # Local test jobs
        - template: /eng/pipelines/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/build.yml
            isOfficialBuild: ${{ variables.isOfficialBuild }}
            configurations:
            - ${{ variables.buildConfiguration }}
            platforms:
            - win-x64
            - win-x86
            - osx-x64
            - linux-x64
            - linux-musl-x64
            jobParameters:
              pipelineJobTemplate: ${{ variables.jobTemplate }}
              testOnly: true
              dependsOnBuild: false

        # Helix test jobs
        - template: /eng/pipelines/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/tests-helix.yml
            isOfficialBuild: ${{ variables.isOfficialBuild }}
            configurations:
            - ${{ variables.buildConfiguration }}
            platforms:
            - win-x64
            - win-x86
            - win-arm64
            - linux-x64
            - linux-arm64
            - linux-musl-x64
            - osx-x64
            - osx-arm64
            jobParameters:
              pipelineJobTemplate: ${{ variables.jobTemplate }}
              dependsOnBuild: false

    ########################
    # Package/Publish stage
    ########################

    - ${{ if notin(variables['Build.Reason'], 'PullRequest') }}:
      - stage: package
        displayName: Package, Sign, and Publish
        dependsOn: build
        jobs:
        # Package and sign build artifacts
        - template: /eng/pipelines/package-sign-publish.yml
          parameters:
            configuration: ${{ variables.buildConfiguration }}
            pipelineJobTemplate: ${{ variables.jobTemplate }}
            isOfficialBuild: ${{ variables.isOfficialBuild }}

        # Register official build assets in BAR
        - ${{ if ne(variables['System.TeamProject'], 'public') }}:
          - template: /eng/common/templates-official/job/publish-build-assets.yml
            parameters:
              configuration: ${{ variables.buildConfiguration }}
              dependsOn: Package_Sign_Publish
              publishUsingPipelines: true

    ########################
    # Installed Tests stage
    ########################

    - ${{ if and(notin(variables['Build.Reason'], 'PullRequest'), eq(variables.isOfficialBuild, true), ne(parameters.buildOnly, true)) }}:
      - stage: test_packaged
        displayName: Test installed build artifacts
        dependsOn: package
        jobs:
        # Test tools installed from the signed packages
        - template: /eng/pipelines/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/tests-packaged-sos.yml
            isOfficialBuild: ${{ variables.isOfficialBuild }}
            configurations:
            - ${{ variables.buildConfiguration }}
            platforms:
            - win-x64
            - win-x86
            - win-arm64
            - linux-x64
            - linux-arm64
            - linux-musl-x64
            - osx-x64
            - osx-arm64
            jobParameters:
              pipelineJobTemplate: ${{ variables.jobTemplate }}

    ########################
    # Validate/Publish stages
    ########################

    # Validate build assets, then publish using Darc
    - ${{ if and(ne(variables['System.TeamProject'], 'public'), notin(variables['Build.Reason'], 'PullRequest')) }}:
      - template: /eng/common/templates-official/post-build/post-build.yml@self
        parameters:
          # This is to enable SDL runs part of Post-Build Validation Stage.
          # as well as NuGet, SourceLink, and signing validation.
          # The variables get imported from group dotnet-diagnostics-sdl-params
          validateDependsOn: package
          publishingInfraVersion: 3
          enableSourceLinkValidation: true
          enableSigningValidation: false
          enableSymbolValidation: false
          enableNugetValidation: true
          symbolPublishingAdditionalParameters: '/p:PublishSpecialClrFiles=false'
          publishInstallersAndChecksums: true

    ########################
    # Prepare Release stage
    ########################

    - template: /eng/pipelines/prepare-release.yml
      parameters:
        isOfficialBuild: ${{ variables['isOfficialBuild'] }}
        repoAllowList: https://github.com/dotnet/diagnostics https://dev.azure.com/dnceng/internal/_git/dotnet-diagnostics
        productAllowList: diagnostics dotnet-diagnostics
        skipFileList: MergedManifest.xml
        ${{ if eq(variables.isOfficialBuild, true) }}:
          dependsOn: [ publish_using_darc ]
        ${{ else }}:
          dependsOn: [ build ]
