parameters:
- name: runtimeFeed
  displayName: Feed for runtime installation
  type: string
  default: default
  values:
  - default
  - custom
  - dotnetclimsrc-feed
- name: runtimeFeedToken
  displayName: Base 64 SAS Token for runtime installation
  type: string
  default: default
  values:
  - default
  - custom
  - dotnetclimsrc-sas-token-base64
- name: buildOnly
  displayName: Build only (skip tests)
  type: boolean
  default: false

trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - main
    - release/*
    - internal/*
  paths:
    exclude:
    - documentation/*
    - THIRD-PARTY-NOTICES.TXT
    - LICENSE.TXT

variables:
- ${{ if and(notin(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.DefinitionName'], 'dotnet-diagnostics')) }}:
  - name: isOfficialBuild
    value: true
- ${{ else }}:
  - name: isOfficialBuild
    value: false
- template : /eng/pipelines/global-variables.yml
  parameters:
    runtimeFeed: ${{ parameters.runtimeFeed }}
    runtimeFeedToken: ${{ parameters.runtimeFeedToken }}

extends:
  template: /eng/pipelines/pipeline-resources.yml
  parameters:
    stages:
    - stage: build
      displayName: Build Diagnostics
      jobs:

        ############################
        #                          #
        #    Source Build leg      #
        #                          #
        ############################

      - template: ${{ variables.sourceBuildTemplate }}
        parameters:
          enableInternalSources: true
          platform:
            name: Complete
            buildScript: ./eng/common/build.sh

      ############################
      #                          #
      #        Build legs        #
      #                          #
      ############################

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          name: Windows
          osGroup: Windows_NT
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Debug
            architecture: x64
            artifactUploadPath: bin/Windows_NT.x64.Debug
          - configuration: Release
            architecture: x64
            artifactUploadPath: bin
          - configuration: Release
            architecture: x86
            artifactUploadPath: bin/Windows_NT.x86.Release
          - configuration: Release
            architecture: arm64
            artifactUploadPath: bin/Windows_NT.arm64.Release

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          osGroup: Linux
          container: linux_x64
          crossBuild: true
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: x64
            artifactUploadPath: bin/linux.x64.Release
          - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
            - configuration: Debug
              architecture: x64
              artifactUploadPath: bin/linux.x64.Debug

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          name: Linux_musl
          osGroup: Linux
          osSuffix: -musl
          container: linux_musl_x64
          crossBuild: true
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: x64
            artifactUploadPath: bin/linux.x64.Release
            artifactTargetPath: bin/linux-musl.x64.Release
          - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
            - configuration: Debug
              architecture: x64
              artifactUploadPath: bin/linux.x64.Debug
              artifactTargetPath: bin/linux-musl.x64.Debug

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          osGroup: MacOS
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: x64
            artifactUploadPath: bin/osx.x64.Release
          - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
            - configuration: Debug
              architecture: x64
              artifactUploadPath: bin/osx.x64.Debug

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          osGroup: MacOS
          crossBuild: true
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: arm64
            artifactUploadPath: bin/osx.arm64.Release
          - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
            - configuration: Debug
              architecture: arm64

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          osGroup: Linux
          container: linux_arm
          crossBuild: true
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: arm
            artifactUploadPath: bin/linux.arm.Release

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          osGroup: Linux
          container: linux_arm64
          crossBuild: true
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: arm64
            artifactUploadPath: bin/linux.arm64.Release

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          name: Linux_musl
          osGroup: Linux
          osSuffix: -musl
          container: linux_musl_arm
          crossBuild: true
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: arm
            artifactUploadPath: bin/linux.arm.Release
            artifactTargetPath: bin/linux-musl.arm.Release

      - template: /eng/pipelines/build.yml
        parameters:
          jobTemplate: ${{ variables.jobTemplate }}
          name: Linux_musl
          osGroup: Linux
          osSuffix: -musl
          container: linux_musl_arm64
          crossBuild: true
          buildOnly: true
          publishTestArtifacts: true
          buildConfigs:
          - configuration: Release
            architecture: arm64
            artifactUploadPath: bin/linux.arm64.Release
            artifactTargetPath: bin/linux-musl.arm64.Release

    ############################
    #                          #
    #        Test stage        #
    #                          #
    ############################

    - ${{ if ne(parameters.buildOnly, true) }}:
      - stage: test
        displayName: Test Diagnostics
        dependsOn: build
        jobs:

        - template: /eng/pipelines/helix-test.yml
          parameters:
            jobTemplate: ${{ variables.jobTemplate }}
            testConfigs:
            - name: Windows_x64_Debug
              displayName: Windows x64 Debug
              dependsOn: Windows
              configuration: Debug
              architecture: x64
              targetOS: Windows_NT
              queue: Windows.11.Amd64.Client.Open
              internalQueue: Windows.11.Amd64
            - name: Windows_x64_Release
              displayName: Windows x64 Release
              dependsOn: Windows
              configuration: Release
              architecture: x64
              targetOS: Windows_NT
              queue: Windows.11.Amd64.Client.Open
              internalQueue: Windows.11.Amd64
            - name: Windows_x86_Release
              displayName: Windows x86 Release
              dependsOn: Windows
              configuration: Release
              architecture: x86
              targetOS: Windows_NT
              queue: Windows.10.Amd64.Open
              internalQueue: Windows.10.Amd64.X86.Rt
            - name: Windows_arm64_Release
              displayName: Windows arm64 Release
              dependsOn: Windows
              configuration: Release
              architecture: arm64
              targetOS: Windows_NT
              queue: Windows.11.Arm64.Open
              internalQueue: Windows.11.Arm64
            - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
              - name: Linux_x64_Debug
                displayName: Linux x64 Debug
                dependsOn: Linux
                configuration: Debug
                architecture: x64
                targetOS: linux
                queue: AzureLinux.3.Amd64.Open
                internalQueue: AzureLinux.3.Amd64
            - name: Linux_x64_Release
              displayName: Linux x64 Release
              dependsOn: Linux
              configuration: Release
              architecture: x64
              targetOS: linux
              queue: AzureLinux.3.Amd64.Open
              internalQueue: AzureLinux.3.Amd64
            - name: Linux_arm_Release
              displayName: Linux arm Release
              dependsOn: Linux
              configuration: Release
              architecture: arm
              targetOS: linux
              queue: (Debian.13.Arm32.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:debian-13-helix-arm32v7
              internalQueue: (Debian.13.Arm32)AzureLinux.3.Arm64@mcr.microsoft.com/dotnet-buildtools/prereqs:debian-13-helix-arm32v7
            - name: Linux_arm64_Release
              displayName: Linux arm64 Release
              dependsOn: Linux
              configuration: Release
              architecture: arm64
              targetOS: linux
              queue: AzureLinux.3.Arm64.Open
              internalQueue: AzureLinux.3.Arm64
            - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
              - name: Linux_musl_x64_Debug
                displayName: Linux musl x64 Debug
                dependsOn: Linux_musl
                configuration: Debug
                architecture: x64
                targetOS: linux
                queue: (Alpine.324.Amd64.Open)AzureLinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-amd64
                internalQueue: (Alpine.324.Amd64)AzureLinux.3.Amd64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-amd64
            - name: Linux_musl_x64_Release
              displayName: Linux musl x64 Release
              dependsOn: Linux_musl
              configuration: Release
              architecture: x64
              targetOS: linux
              queue: (Alpine.324.Amd64.Open)AzureLinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-amd64
              internalQueue: (Alpine.324.Amd64)AzureLinux.3.Amd64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-amd64
            - name: Linux_musl_arm_Release
              displayName: Linux musl arm Release
              dependsOn: Linux_musl
              configuration: Release
              architecture: arm
              targetOS: linux
              queue: (Alpine.324.Arm32.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm32v7
              internalQueue: (Alpine.324.Arm32)AzureLinux.3.Arm64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm32v7
            - name: Linux_musl_arm64_Release
              displayName: Linux musl arm64 Release
              dependsOn: Linux_musl
              configuration: Release
              architecture: arm64
              targetOS: linux
              queue: (Alpine.324.Arm64.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm64v8
              internalQueue: (Alpine.324.Arm64)AzureLinux.3.Arm64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm64v8
            - ${{ if in(variables['Build.Reason'], 'PullRequest') }}:
              - name: MacOS_x64_Debug
                displayName: macOS x64 Debug
                dependsOn: MacOS
                configuration: Debug
                architecture: x64
                targetOS: osx
                queue: OSX.15.Amd64.Open
                internalQueue: OSX.15.Amd64
              - name: MacOS_arm64_Debug
                displayName: macOS arm64 Debug
                dependsOn: MacOS
                configuration: Debug
                architecture: arm64
                targetOS: osx
                queue: OSX.26.Arm64.Open
                internalQueue: OSX.26.Arm64
            - name: MacOS_x64_Release
              displayName: macOS x64 Release
              dependsOn: MacOS
              configuration: Release
              architecture: x64
              targetOS: osx
              queue: OSX.15.Amd64.Open
              internalQueue: OSX.15.Amd64
            - name: MacOS_arm64_Release
              displayName: macOS arm64 Release
              dependsOn: MacOS
              configuration: Release
              architecture: arm64
              targetOS: osx
              queue: OSX.26.Arm64.Open
              internalQueue: OSX.26.Arm64

    ############################
    #                          #
    #      Package stage       #
    #                          #
    ############################

    - ${{ if and(ne(variables['System.TeamProject'], 'public'), notin(variables['Build.Reason'], 'PullRequest')) }}:
      - stage: package
        displayName: Package, Sign, and Generate BAR Manifests
        dependsOn: build
        jobs:
        - template: /eng/common/templates-official/job/job.yml
          parameters:
            name: Package_Sign_Publish
            displayName: Packaging
            condition: succeeded()
            enablePublishUsingPipelines: true
            enableMicrobuild: true
            templateContext:
              outputs:
              - output: pipelineArtifact
                artifact: BundledTools
                path: '$(Build.SourcesDirectory)/artifacts/bundledtools'
                displayName: 'Publish Bundled Tools'
                condition: succeeded()
              - output: pipelineArtifact
                artifact: Logs_Packaging_Signing_Attempt$(System.JobAttempt)
                path: '$(Build.SourcesDirectory)/artifacts/log'
                displayName: 'Publish Signing and Packaging Logs'
                condition: always()
                continueOnError: true
                sbomEnabled: false # we don't need SBOM for logs
            steps:
            - task: DownloadPipelineArtifact@2
              displayName: 'Download release builds'
              inputs:
                patterns: |
                  Build_Linux_*_Release/bin/**
                  Build_Linux_musl_*_Release/bin/**
                  Build_Windows_*_Release/bin/**
                  Build_MacOS_*_Release/bin/**
                downloadPath: '$(Build.ArtifactStagingDirectory)/__download__'
                checkDownloadedFiles: true
                cleanDestinationFolder: true

            - powershell: |
                cd $(Build.ArtifactStagingDirectory)/__download__

                $dirs = Get-ChildItem -Directory
                if ($dirs.Count -ne 11) {
                  throw "Expected 11 release platforms to be present. 3 Linux glibc, 3 Linux musl, 3 Windows, and 2 macOS."
                }

                $targetDir = "$(Build.SourcesDirectory)/artifacts/bin"
                if (!(Test-Path $targetDir)) {
                  New-Item $targetDir -ItemType Directory
                }

                $dirs | ForEach-Object {
                  $sourceDir = "$($_.FullName)/bin"
                  Move-Item -Path $sourceDir/* -Destination $targetDir -Verbose
                }
              displayName: 'Setup layout for packaging'

            # Create nuget packages, sign binaries and publish to blob feed
            - script: $(Build.SourcesDirectory)\eng\ci-prepare-artifacts.cmd /p:DotNetSignType=$(_SignType) /p:TeamName=$(_TeamName) /p:DotNetPublishUsingPipelines=true /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
              displayName: Package, Sign, and Publish
              continueOnError: false
              condition: succeeded()

        - template: /eng/common/templates-official/job/publish-build-assets.yml
          parameters:
            configuration: Release
            dependsOn: Package_Sign_Publish
            publishUsingPipelines: true

      - template: /eng/common/templates-official/post-build/post-build.yml@self
        parameters:
          # This is to enable SDL runs part of Post-Build Validation Stage.
          # as well as NuGet, SourceLink, and signing validation.
          # The variables get imported from group dotnet-diagnostics-sdl-params
          validateDependsOn: package
          publishingInfraVersion: 3
          enableSourceLinkValidation: true
          enableSigningValidation: false
          enableSymbolValidation: false
          enableNugetValidation: true
          symbolPublishingAdditionalParameters: '/p:PublishSpecialClrFiles=false'
          publishInstallersAndChecksums: true

    # This sets up the bits to do a Release.
    - template: /eng/pipelines/prepare-release.yml
      parameters:
        isOfficialBuild: ${{ variables['isOfficialBuild'] }}
        repoAllowList: https://github.com/dotnet/diagnostics https://dev.azure.com/dnceng/internal/_git/dotnet-diagnostics
        productAllowList: diagnostics dotnet-diagnostics
        ${{ if eq(variables['isOfficialBuild'], 'true') }}:
          dependsOn: [ publish_using_darc ]
        ${{ else }}:
          dependsOn: [ build ]
