parameters:
- name: runtimeFeed
  displayName: Feed for runtime installation
  type: string
  default: default
  values:
  - default
  - custom
  - dotnetclimsrc-feed
- name: runtimeFeedToken
  displayName: Base 64 SAS Token for runtime installation
  type: string
  default: default
  values:
  - default
  - custom
  - dotnetclimsrc-sas-token-base64
- name: buildOnly
  displayName: Build only (skip tests)
  type: boolean
  default: false

trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - '*'
  paths:
    exclude:
    - documentation/*
    - THIRD-PARTY-NOTICES.TXT
    - LICENSE.TXT

extends:
  template: /eng/pipelines/diagnostics.yml
  parameters:
    runtimeFeed: ${{ parameters.runtimeFeed }}
    runtimeFeedToken: ${{ parameters.runtimeFeedToken }}
    buildOnly: ${{ parameters.buildOnly }}
