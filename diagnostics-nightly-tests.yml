parameters:
- name: packageVersion
  displayName: Exact diagnostics package version from the dotnet-tools feed
  type: string

trigger: none
pr: none

variables:
- name: isOfficialBuild
  value: false
- template: /eng/pipelines/global-variables.yml
- template: /eng/pipelines/helix-platforms.yml

extends:
  template: /eng/pipelines/pipeline-resources.yml
  parameters:
    stages:
    - template: /eng/pipelines/test-nightly-sos.yml
      parameters:
        packageVersion: ${{ parameters.packageVersion }}
        pipelineJobTemplate: ${{ variables.jobTemplate }}
