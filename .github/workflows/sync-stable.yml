name: Update release/stable

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: sync-release-stable
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'dotnet/diagnostics'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the stable update PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = 'release/stable';
            const head = 'main';
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`
            });
            if (comparison.data.ahead_by === 0) {
              core.info('release/stable already contains main.');
              return;
            }

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', base, head: `${owner}:${head}`
            });
            if (existing.data.length > 1) {
              throw new Error('More than one open main -> release/stable PR was found.');
            }
            let pr = existing.data[0];
            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner, repo, base, head,
                title: 'Merge main into release/stable',
                body: 'Weekly update of release/stable from main. This workflow only opens or reuses the PR; it does not merge it or publish release artifacts.'
              })).data;
            }

            await core.summary
              .addLink('Stable update PR', pr.html_url)
              .write();
