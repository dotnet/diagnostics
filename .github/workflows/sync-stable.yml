name: Update release/stable

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 5'

concurrency:
  group: sync-release-stable
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'dotnet/diagnostics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update the stable sync branch
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: release/stable
          SOURCE_BRANCH: main
          PR_BRANCH: automation/release-sync
        run: |
          set -euo pipefail

          git fetch origin \
            "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" \
            "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          stable_sha=$(git rev-parse "origin/$BASE_BRANCH^{commit}")
          main_sha=$(git rev-parse "origin/$SOURCE_BRANCH^{commit}")
          if git merge-base --is-ancestor "$main_sha" "$stable_sha"; then
            echo "$BASE_BRANCH already contains $SOURCE_BRANCH."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$PR_BRANCH" > /dev/null; then
            git fetch origin "refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH"
            git switch -c "$PR_BRANCH" --track "origin/$PR_BRANCH"
          else
            git switch -c "$PR_BRANCH" "$stable_sha"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-edit "$stable_sha"
          git merge --no-edit "$main_sha"

          version_files=(
            eng/Versions.props
            eng/Version.Details.props
            eng/Version.Details.xml
            global.json
          )
          git restore --source="$stable_sha" -- "${version_files[@]}"
          if ! git diff --quiet -- "${version_files[@]}"; then
            git add -- "${version_files[@]}"
            git commit -m "Preserve release/stable version metadata"
          fi

          gh auth setup-git
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update the stable sync pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: release/stable
          PR_BRANCH: automation/release-sync
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/release-sync-pr.md"
          cat > "$body_file" <<'EOF'
          Weekly source update of `release/stable` from `main`.

          This sync intentionally does not update version or dependency metadata. Those versions must be bumped independently in a separate, reviewed `release/stable` pull request.

          This workflow updates the branch and pull request but does not merge it or publish release artifacts.
          EOF

          repo_owner=${GITHUB_REPOSITORY%%/*}
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PR_BRANCH" --base "$BASE_BRANCH" --state open --json number,headRepositoryOwner --jq "[.[] | select(.headRepositoryOwner.login == \"$repo_owner\")][0].number // empty")
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Merge main into release/stable" \
              --body-file "$body_file"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$PR_BRANCH" \
              --title "Merge main into release/stable" \
              --body-file "$body_file"
          fi
