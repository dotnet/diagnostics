name: Update release/stable

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: sync-release-stable
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'dotnet/diagnostics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Open the stable update PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = 'release/stable';
            const head = 'release/weekly-staging';
            const [stable, main] = await Promise.all([
              github.rest.repos.getBranch({ owner, repo, branch: base }),
              github.rest.repos.getBranch({ owner, repo, branch: 'main' })
            ]);
            const stableSha = stable.data.commit.sha;
            const mainSha = main.data.commit.sha;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${stableSha}...${mainSha}`
            });
            if (comparison.data.ahead_by === 0) {
              core.info('release/stable already contains main.');
              return;
            }

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', base, head: `${owner}:${head}`
            });
            if (existing.data.length > 1) {
              throw new Error('More than one open weekly-staging -> release/stable PR was found.');
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${head}` });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${head}`, sha: stableSha
              });
            }

            await github.rest.repos.merge({
              owner, repo, base: head, head: stableSha,
              commit_message: `Merge ${base} into ${head}`
            });
            await github.rest.repos.merge({
              owner, repo, base: head, head: mainSha,
              commit_message: `Merge main into ${head}`
            });

            let pr = existing.data[0];
            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner, repo, base, head,
                title: 'Merge weekly staging into release/stable',
                body: 'Weekly merge of release/stable and main into release/weekly-staging. Staging-branch pushes run Release dry-run validation. This workflow does not merge into release/stable or publish release artifacts.'
              })).data;
            }

            await core.summary
              .addLink('Stable update PR', pr.html_url)
              .write();
