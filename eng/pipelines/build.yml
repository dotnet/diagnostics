parameters:
# Public or official Arcade job wrapper.
- name: pipelineJobTemplate
  type: string
# Build configuration generated by platform-matrix.yml.
- name: configuration
  type: string
# Platform metadata generated by platform-matrix.yml.
- name: platform
  type: object
# Run tests from previously published build outputs instead of building.
- name: testOnly
  type: boolean
  default: false
- name: isOfficialBuild
  type: boolean
  default: false

jobs:
- template: ${{ parameters.pipelineJobTemplate }}
  parameters:
    ${{ if eq(parameters.testOnly, true) }}:
      name: ${{ parameters.platform.name }}_Test_${{ parameters.platform.arch }}_${{ parameters.configuration }}
    ${{ else }}:
      name: ${{ parameters.platform.name }}_${{ parameters.platform.arch }}_${{ parameters.configuration }}
    ${{ if eq(parameters.testOnly, true) }}:
      displayName: Test ${{ replace(parameters.platform.name, '_', '-') }} ${{ parameters.platform.arch }} ${{ parameters.configuration }}
    ${{ else }}:
      displayName: Build ${{ replace(parameters.platform.name, '_', '-') }} ${{ parameters.platform.arch }} ${{ parameters.configuration }}
    timeoutInMinutes: 180
    enableMicrobuild: true
    disableComponentGovernance: ${{ and(eq(parameters.testOnly, true), startsWith(parameters.platform.rid, 'linux-musl-')) }}

    pool:
      ${{ if eq(parameters.platform.os, 'windows') }}:
        name: $(BuildPool)
        demands: ImageOverride -equals $(WindowsImage)
        os: windows
      ${{ elseif eq(parameters.platform.os, 'linux') }}:
        name: $(BuildPool)
        demands: ImageOverride -equals $(LinuxImage)
        os: linux
      ${{ elseif eq(parameters.platform.os, 'osx') }}:
        name: Azure Pipelines
        vmImage: $(macOSImage)
        os: macOS
      ${{ else }}:
        'error, unsupported OS': ${{ parameters.platform.os }}

    ${{ if and(eq(parameters.testOnly, true), eq(parameters.platform.os, 'linux')) }}:
      container: test_${{ parameters.platform.queueKey }}
    ${{ elseif and(eq(parameters.testOnly, false), eq(parameters.platform.os, 'linux')) }}:
      container: ${{ parameters.platform.queueKey }}

    ${{ if eq(parameters.testOnly, true) }}:
      dependsOn: ${{ parameters.platform.name }}_${{ parameters.platform.arch }}_${{ parameters.configuration }}

    workspace:
      clean: all

    variables:
    - ${{ if eq(parameters.testOnly, true) }}:
      - _PhaseName: ${{ parameters.platform.name }}_Test_${{ parameters.platform.arch }}_${{ parameters.configuration }}
    - ${{ else }}:
      - _PhaseName: ${{ parameters.platform.name }}_${{ parameters.platform.arch }}_${{ parameters.configuration }}
    - _Pipeline_StreamDumpDir: $(Build.SourcesDirectory)/artifacts/tmp/${{ parameters.configuration }}/streams
    - _TestArgs: '-test'
    - _Cross: ''

    # Test-only legs invoke test.cmd/test.sh, which already encode
    # '-test -skipmanaged -skipnative'. Build legs invoke build.cmd/build.sh.
    - ${{ if eq(parameters.testOnly, true) }}:
      - ${{ if eq(parameters.platform.os, 'windows') }}:
        - _buildScript: $(Build.SourcesDirectory)\test.cmd
      - ${{ else }}:
        - _buildScript: $(Build.SourcesDirectory)/test.sh
      - _TestArgs: ''
    - ${{ else }}:
      - ${{ if eq(parameters.platform.os, 'windows') }}:
        - _buildScript: $(Build.SourcesDirectory)\build.cmd
      - ${{ else }}:
        - _buildScript: $(Build.SourcesDirectory)/build.sh
      - _TestArgs: ''

    # For testing MSRC and service releases. The runtime versions and feed
    # identify the servicing runtime to install.
    - _InternalInstallArgs: ''
    - ${{ if and(ne(variables['System.TeamProject'], 'public'), notin(variables['Build.Reason'], 'PullRequest')) }}:
      - _InternalInstallArgs:
          -dotnetruntimeversion '$(DotnetRuntimeVersion)'
          -dotnetruntimedownloadversion '$(DotnetRuntimeDownloadVersion)'
          -runtimesourcefeed '$(RuntimeFeedUrl)'
          -runtimesourcefeedkey '$(RuntimeFeedBase64SasToken)'

    # Linux builds and macOS ARM64 builds target a different environment
    # than the host agent.
    - ${{ if and(eq(parameters.testOnly, false), or(eq(parameters.platform.os, 'linux'), and(eq(parameters.platform.os, 'osx'), eq(parameters.platform.arch, 'arm64')))) }}:
      - _Cross: -cross

    steps:
    - ${{ if eq(parameters.testOnly, true) }}:
      # Restore the complete output from the matching build leg so tests can
      # skip both managed and native compilation.
      - task: DownloadPipelineArtifact@2
        displayName: Download Build Artifacts
        inputs:
          artifact: TestArtifacts_${{ parameters.platform.name }}_${{ parameters.platform.arch }}_${{ parameters.configuration }}
          targetPath: '$(Build.SourcesDirectory)/artifacts'
          checkDownloadedFiles: true

    - script: $(_buildScript)
        -ci
        -binaryLog
        -configuration ${{ parameters.configuration }}
        -architecture ${{ parameters.platform.arch }}
        $(_TestArgs)
        $(_Cross)
        $(_InternalInstallArgs)
        /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
      ${{ if eq(parameters.testOnly, true) }}:
        displayName: Test
        continueOnError: ${{ parameters.isOfficialBuild }}
      ${{ else }}:
        displayName: Build
      condition: succeeded()

    - ${{ if eq(parameters.testOnly, false) }}:
      - task: CopyFiles@2
        displayName: Gather binaries for publish
        inputs:
          ${{ if and(eq(parameters.platform.os, 'windows'), eq(parameters.platform.arch, 'x64'), eq(parameters.configuration, 'Release')) }}:
            SourceFolder: '$(Build.SourcesDirectory)/artifacts/bin'
          ${{ else }}:
            SourceFolder: "$(Build.SourcesDirectory)/artifacts/bin/${{ replace(parameters.platform.os, 'windows', 'Windows_NT') }}.${{ parameters.platform.arch }}.${{ parameters.configuration }}"
          Contents: '**'
          ${{ if ne(coalesce(parameters.platform.artifactOS, ''), '') }}:
            TargetFolder: $(Build.ArtifactStagingDirectory)/artifacts/bin/${{ parameters.platform.artifactOS }}.${{ parameters.platform.arch }}.${{ parameters.configuration }}
          ${{ elseif and(eq(parameters.platform.os, 'windows'), eq(parameters.platform.arch, 'x64'), eq(parameters.configuration, 'Release')) }}:
            TargetFolder: $(Build.ArtifactStagingDirectory)/artifacts/bin
          ${{ else }}:
            TargetFolder: "$(Build.ArtifactStagingDirectory)/artifacts/bin/${{ replace(parameters.platform.os, 'windows', 'Windows_NT') }}.${{ parameters.platform.arch }}.${{ parameters.configuration }}"

      - template: /eng/pipelines/publish-pipeline-artifact-shim.yml@self
        parameters:
          displayName: Publish Build Artifacts
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/artifacts'
            artifactName: Build_$(_PhaseName)

    # Publish the complete build outputs consumed by normal-test and SOS jobs.
    - ${{ if eq(parameters.testOnly, false) }}:
      - task: CopyFiles@2
        displayName: Gather test artifacts for publish
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)/artifacts'
          Contents: |
            bin/**
            obj/**
            test/**
          TargetFolder: $(Build.ArtifactStagingDirectory)/testartifacts

      - template: /eng/pipelines/publish-pipeline-artifact-shim.yml@self
        parameters:
          displayName: Publish Test Artifacts
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/testartifacts'
            artifactName: TestArtifacts_$(_PhaseName)

    # Publish test results to Azure Pipelines.
    - ${{ if eq(parameters.testOnly, true) }}:
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: xUnit
          testResultsFiles: '**/*.xml'
          searchFolder: '$(Build.SourcesDirectory)/artifacts/TestResults'
          testRunTitle: 'Tests $(_PhaseName)'
          failTaskOnFailedTests: true
          publishRunAttachments: true
          mergeTestResults: true
          buildConfiguration: ${{ parameters.configuration }}
        continueOnError: ${{ parameters.isOfficialBuild }}
        condition: always()

    - task: CopyFiles@2
      displayName: Gather Logs
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)/artifacts'
        contents: '?(log|TestResults)/**'
        targetFolder: '$(Build.StagingDirectory)/BuildLogs'
      continueOnError: true
      condition: always()

    - template: /eng/pipelines/publish-pipeline-artifact-shim.yml@self
      parameters:
        displayName: Publish Logs
        inputs:
          targetPath: '$(Build.StagingDirectory)/BuildLogs'
          artifactName: Logs_$(_PhaseName)_$(System.JobAttempt)
          sbomEnabled: false
        continueOnError: true
        condition: always()

    - pwsh: |
        $source = "$(Build.SourcesDirectory)/artifacts"
        $dest = "$(Build.ArtifactStagingDirectory)/artifacts_on_failure"
        New-Item -ItemType Directory -Force -Path $dest

        # Move non-dump artifacts.
        $patterns = @("bin", "Debuggees", "log", "TestResults")
        foreach ($p in $patterns) {
          $src = Join-Path $source $p
          if (Test-Path $src) {
            $target = Join-Path $dest $p
            Move-Item -Force $src $target
          }
        }

        # Tar dumps and streams directly from source to avoid ENOSPC.
        # Peak disk use is the original files plus the smaller compressed archive.
        $dumpSrc = Join-Path $source "tmp/${{ parameters.configuration }}/dumps"
        $streamSrc = Join-Path $source "tmp/${{ parameters.configuration }}/streams"

        $tarInputs = @()
        if (Test-Path $dumpSrc) { $tarInputs += "tmp/${{ parameters.configuration }}/dumps" }
        if (Test-Path $streamSrc) { $tarInputs += "tmp/${{ parameters.configuration }}/streams" }

        if ($tarInputs.Count -gt 0) {
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $tarPath = Join-Path $dest "diagnostics-dumps.tar.gz"
          tar -czf $tarPath -C $source @tarInputs
          foreach ($t in $tarInputs) { Remove-Item -Recurse -Force (Join-Path $source $t) }
        }
      displayName: Gather diagnostic artifacts on failure
      continueOnError: true
      condition: failed()

    - template: /eng/pipelines/publish-pipeline-artifact-shim.yml@self
      parameters:
        displayName: Publish diagnostic artifacts on failure
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/artifacts_on_failure
          artifactName: Artifacts_On_Failure_$(_PhaseName)_$(System.JobAttempt)
          sbomEnabled: false
        continueOnError: true
        condition: failed()
