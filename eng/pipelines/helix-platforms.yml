# Helix Platform Definitions
# This template defines versioned Helix queues and stable platform aliases.

variables:

  # macOS platforms

  - name: helix_macos_arm64_osx_26
    value: OSX.26.Arm64.Open

  - name: helix_macos_arm64_osx_26_internal
    value: OSX.26.Arm64

  - name: helix_macos_x64_osx_15
    value: OSX.15.Amd64.Open

  - name: helix_macos_x64_osx_15_internal
    value: OSX.15.Amd64

  # Linux platforms

  - name: helix_linux_x64_ubuntu_2404
    value: Ubuntu.2404.Amd64.Open

  - name: helix_linux_x64_ubuntu_2404_internal
    value: Ubuntu.2404.Amd64

  - name: helix_linux_arm64_ubuntu_2404
    value: Ubuntu.2404.ArmArch.Open

  - name: helix_linux_arm64_ubuntu_2404_internal
    value: Ubuntu.2404.ArmArch

  - name: helix_linux_musl_x64_alpine_323
    value: '(Alpine.323.Amd64.Open)azurelinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.23-helix-amd64'

  - name: helix_linux_musl_x64_alpine_323_internal
    value: '(Alpine.323.Amd64)azurelinux.3.Amd64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.23-helix-amd64'

  # Windows platforms

  - name: helix_windows_x64_runtime
    value: Windows.Amd64.Open.rt

  - name: helix_windows_x64_runtime_internal
    value: Windows.Amd64.rt

  - name: helix_windows_arm64_windows_11
    value: Windows.11.Arm64.Open

  - name: helix_windows_arm64_windows_11_internal
    value: Windows.11.Arm64

  # Common aliases
  # These must remain after the versioned definitions they reference.

  - name: helix_osx_arm64
    value: ${{ variables.helix_macos_arm64_osx_26 }}

  - name: helix_osx_arm64_internal
    value: ${{ variables.helix_macos_arm64_osx_26_internal }}

  - name: helix_osx_x64
    value: ${{ variables.helix_macos_x64_osx_15 }}

  - name: helix_osx_x64_internal
    value: ${{ variables.helix_macos_x64_osx_15_internal }}

  - name: helix_linux_x64
    value: ${{ variables.helix_linux_x64_ubuntu_2404 }}

  - name: helix_linux_x64_internal
    value: ${{ variables.helix_linux_x64_ubuntu_2404_internal }}

  - name: helix_linux_arm64
    value: ${{ variables.helix_linux_arm64_ubuntu_2404 }}

  - name: helix_linux_arm64_internal
    value: ${{ variables.helix_linux_arm64_ubuntu_2404_internal }}

  - name: helix_linux_musl_x64
    value: ${{ variables.helix_linux_musl_x64_alpine_323 }}

  - name: helix_linux_musl_x64_internal
    value: ${{ variables.helix_linux_musl_x64_alpine_323_internal }}

  - name: helix_win_x64
    value: ${{ variables.helix_windows_x64_runtime }}

  - name: helix_win_x64_internal
    value: ${{ variables.helix_windows_x64_runtime_internal }}

  - name: helix_win_arm64
    value: ${{ variables.helix_windows_arm64_windows_11 }}

  - name: helix_win_arm64_internal
    value: ${{ variables.helix_windows_arm64_windows_11_internal }}

  # Windows x86 tests run on the Windows x64 Helix queue.
  - name: helix_win_x86
    value: ${{ variables.helix_win_x64 }}

  - name: helix_win_x86_internal
    value: ${{ variables.helix_win_x64_internal }}
