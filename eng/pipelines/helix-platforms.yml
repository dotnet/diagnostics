# Helix Platform Definitions
# This template defines versioned Helix queues and stable platform aliases.

variables:

  # macOS platforms

  - name: helix_macos_arm64_osx_15
    value: OSX.15.Arm64.Open

  - name: helix_macos_arm64_osx_15_internal
    value: OSX.15.Arm64

  - name: helix_macos_x64_osx_15
    value: OSX.15.Amd64.Open

  - name: helix_macos_x64_osx_15_internal
    value: OSX.15.Amd64

  # Linux platforms

  - name: helix_linux_x64_ubuntu_2204
    value: Ubuntu.2204.Amd64.Open

  - name: helix_linux_x64_ubuntu_2204_internal
    value: Ubuntu.2204.Amd64

  - name: helix_linux_arm64_ubuntu_2204
    value: Ubuntu.2204.ArmArch.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-22.04-helix-arm64v8

  - name: helix_linux_arm64_ubuntu_2204_internal
    value: Ubuntu.2204.ArmArch@mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-22.04-helix-arm64v8

  - name: helix_linux_musl_x64_alpine_323
    value: '(Alpine.323.Amd64.Open)azurelinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.23-helix-amd64'

  - name: helix_linux_musl_x64_alpine_323_internal
    value: '(Alpine.323.Amd64)azurelinux.3.Amd64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.23-helix-amd64'

  # Windows platforms

  - name: helix_windows_x64_server_2022
    value: Windows.Amd64.Server2022.Open

  - name: helix_windows_x64_server_2022_internal
    value: Windows.Amd64.Server2022

  # Common aliases
  # These must remain after the versioned definitions they reference.

  - name: helix_osx_arm64
    value: ${{ variables.helix_macos_arm64_osx_15 }}

  - name: helix_osx_arm64_internal
    value: ${{ variables.helix_macos_arm64_osx_15_internal }}

  - name: helix_osx_x64
    value: ${{ variables.helix_macos_x64_osx_15 }}

  - name: helix_osx_x64_internal
    value: ${{ variables.helix_macos_x64_osx_15_internal }}

  - name: helix_linux_x64
    value: ${{ variables.helix_linux_x64_ubuntu_2204 }}

  - name: helix_linux_x64_internal
    value: ${{ variables.helix_linux_x64_ubuntu_2204_internal }}

  - name: helix_linux_arm64
    value: ${{ variables.helix_linux_arm64_ubuntu_2204 }}

  - name: helix_linux_arm64_internal
    value: ${{ variables.helix_linux_arm64_ubuntu_2204_internal }}

  - name: helix_linux_musl_x64
    value: ${{ variables.helix_linux_musl_x64_alpine_323 }}

  - name: helix_linux_musl_x64_internal
    value: ${{ variables.helix_linux_musl_x64_alpine_323_internal }}

  - name: helix_win_x64
    value: ${{ variables.helix_windows_x64_server_2022 }}

  - name: helix_win_x64_internal
    value: ${{ variables.helix_windows_x64_server_2022_internal }}

  # Windows x86 tests run on the Windows x64 Helix queue.
  - name: helix_win_x86
    value: ${{ variables.helix_win_x64 }}

  - name: helix_win_x86_internal
    value: ${{ variables.helix_win_x64_internal }}
