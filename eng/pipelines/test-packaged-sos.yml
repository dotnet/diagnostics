parameters:
- name: pipelineJobTemplate
  type: string

stages:
- stage: test_packaged
  displayName: Test installed build artifacts
  dependsOn: build
  jobs:
  - template: /eng/pipelines/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/tests-helix.yml
      isOfficialBuild: true
      configurations:
      - Release
      platforms:
      - win-x64
      - win-x86
      - win-arm64
      - linux-x64
      - linux-arm64
      - linux-musl-x64
      - osx-x64
      - osx-arm64
      jobParameters:
        pipelineJobTemplate: ${{ parameters.pipelineJobTemplate }}
        toolLayout: Packaged
