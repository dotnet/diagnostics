parameters:
- name: jobTemplate
  type: string
- name: configurations
  type: object
- name: platforms
  type: object
- name: jobParameters
  type: object
  default: {}

jobs:
- ${{ each configuration in parameters.configurations }}:
  - ${{ if containsValue(parameters.platforms, 'windows_x64') }}:
    - template: ${{ parameters.jobTemplate }}
      parameters:
        configuration: ${{ configuration }}
        platform: windows_x64
        buildPrefix: Windows
        archType: x64
        targetOS: Windows_NT
        targetRid: win-x64
        pool:
          name: $(BuildPool)
          demands: ImageOverride -equals $(WindowsImage)
          os: windows
        helixQueue: Windows.Amd64.Server2022.Open
        ${{ insert }}: ${{ parameters.jobParameters }}

  - ${{ if containsValue(parameters.platforms, 'windows_x86') }}:
    - template: ${{ parameters.jobTemplate }}
      parameters:
        configuration: ${{ configuration }}
        platform: windows_x86
        buildPrefix: Windows
        archType: x86
        targetOS: Windows_NT
        targetRid: win-x86
        pool:
          name: $(BuildPool)
          demands: ImageOverride -equals $(WindowsImage)
          os: windows
        helixQueue: Windows.Amd64.Server2022.Open
        ${{ insert }}: ${{ parameters.jobParameters }}

  - ${{ if containsValue(parameters.platforms, 'linux_x64') }}:
    - template: ${{ parameters.jobTemplate }}
      parameters:
        configuration: ${{ configuration }}
        platform: linux_x64
        buildPrefix: Linux
        archType: x64
        targetOS: linux
        targetRid: linux-x64
        pool:
          name: $(BuildPool)
          demands: ImageOverride -equals $(LinuxImage)
          os: linux
        container: test_ubuntu_22_04
        helixQueue: Ubuntu.2204.Amd64.Open
        ${{ insert }}: ${{ parameters.jobParameters }}

  - ${{ if containsValue(parameters.platforms, 'linux_arm64') }}:
    - template: ${{ parameters.jobTemplate }}
      parameters:
        configuration: ${{ configuration }}
        platform: linux_arm64
        buildPrefix: Linux
        archType: arm64
        targetOS: linux
        targetRid: linux-arm64
        pool:
          name: $(BuildPool)
          demands: ImageOverride -equals $(LinuxImage)
          os: linux
        container: test_ubuntu_22_04
        helixQueue: Ubuntu.2204.ArmArch.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-22.04-helix-arm64v8
        ${{ insert }}: ${{ parameters.jobParameters }}

  - ${{ if containsValue(parameters.platforms, 'linux_musl_x64') }}:
    - template: ${{ parameters.jobTemplate }}
      parameters:
        configuration: ${{ configuration }}
        platform: linux_musl_x64
        buildPrefix: Linux_musl
        archType: x64
        targetOS: linux
        targetRid: linux-musl-x64
        pool:
          name: $(BuildPool)
          demands: ImageOverride -equals $(LinuxImage)
          os: linux
        container: test_linux_musl_x64
        helixQueue: '(Alpine.323.Amd64.Open)azurelinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.23-helix-amd64'
        helixPreCommands: sudo apk add --no-cache py3-lldb
        ${{ insert }}: ${{ parameters.jobParameters }}

  - ${{ if containsValue(parameters.platforms, 'osx_x64') }}:
    - template: ${{ parameters.jobTemplate }}
      parameters:
        configuration: ${{ configuration }}
        platform: osx_x64
        buildPrefix: MacOS
        archType: x64
        targetOS: osx
        targetRid: osx-x64
        pool:
          name: Azure Pipelines
          vmImage: $(macOSImage)
          os: macOS
        helixQueue: OSX.15.Amd64.Open
        ${{ insert }}: ${{ parameters.jobParameters }}

  - ${{ if containsValue(parameters.platforms, 'osx_arm64') }}:
    - template: ${{ parameters.jobTemplate }}
      parameters:
        configuration: ${{ configuration }}
        platform: osx_arm64
        buildPrefix: MacOS
        archType: arm64
        targetOS: osx
        targetRid: osx-arm64
        pool:
          name: Azure Pipelines
          vmImage: $(macOSImage)
          os: macOS
        helixQueue: OSX.15.Arm64.Open
        ${{ insert }}: ${{ parameters.jobParameters }}
